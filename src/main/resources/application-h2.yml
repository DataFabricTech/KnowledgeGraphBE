server:
  port: 18081
  shutdown: graceful

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:~/datafabric
    username: datafabric
    password: datafabric
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
      properties:
        hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true


kubernetes:
  namespace: default
  argo-serviceaccount-name: default
  mount-path: /mnt/df/

image:
  train-image: alpine:3.7